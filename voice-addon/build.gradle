plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mc_compat == '26.3' ? project.mod_version : "${project.mod_version}+mc${project.mc_compat}"
group = project.maven_group

base {
	archivesName = 'mineagen-voice'
}

// exclusiveContent: Loom adds Maven Central and other repositories first, and a plain content filter still lets them be
// asked for these groups. Those lookups can only miss, and a rate-limited miss (HTTP 429) fails the whole build.
repositories {
	exclusiveContent {
		forRepository {
			maven {
				url = 'https://maven.maxhenkel.de/repository/public'
				mavenContent { releasesOnly() }
			}
		}
		filter { includeGroup 'de.maxhenkel.voicechat' }
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter { includeGroup 'maven.modrinth' }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation project(':')
	testImplementation files(rootProject.sourceSets.test.output)
	testRuntimeOnly files(rootProject.file("libs/fabric-carpet-${project.carpet_version}.jar"))
	implementation "de.maxhenkel.voicechat:voicechat-api:2.6.20"
	runtimeOnly "maven.modrinth:9eGKb6K1:${project.voicechat_modrinth_version}"
	runtimeOnly "de.maxhenkel.voicechat:voicechat-api:2.6.20:fabric-stub"
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'voicechatApiVersion', '2.6.20'
	inputs.property 'minecraftDependency', project.minecraft_dependency
	filesMatching('fabric.mod.json') {
		expand version: project.version, voicechatApiVersion: '2.6.20', minecraftDependency: project.minecraft_dependency
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

sourceSets {
	legacyCoreTest {
		java.srcDir 'src/legacyCoreTest/java'
		compileClasspath = sourceSets.main.compileClasspath
	}
}

tasks.named('test') {
	failOnNoDiscoveredTests = false
}

tasks.named('compileTestJava') {
	options.compilerArgs += ['--add-modules', 'jdk.httpserver']
}

def voiceAddonVerificationMainClass = 'dev.agaminggod.mineagen.voiceaddon.VoiceAddonVerificationMain'
def voiceAddonVerificationClassFile = layout.buildDirectory.file(
	"classes/java/test/${voiceAddonVerificationMainClass.replace('.', '/')}.class"
)

tasks.register('verifyVoiceAddon', JavaExec) {
	group = 'verification'
	description = 'Runs the required headless voice-addon verification main.'
	dependsOn tasks.named('testClasses'), tasks.named('legacyCoreTestClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass.set(voiceAddonVerificationMainClass)
	jvmArgs '--add-modules', 'jdk.httpserver'
	workingDir rootProject.projectDir

	doFirst {
		systemProperty 'mineagen.legacyCoreClasses',
				sourceSets.legacyCoreTest.output.classesDirs.singleFile.absolutePath
		def verificationMain = voiceAddonVerificationClassFile.get().asFile
		if (!verificationMain.isFile()) {
			throw new GradleException(
				"Required voice-addon verification main is missing: ${project.relativePath(verificationMain)}"
			)
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('verifyVoiceAddon')
}
