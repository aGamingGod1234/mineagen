# Gradle runtime
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=false
# Gradle retries a download that fails with HTTP 429, 408 or 5xx. The default 3 attempts, 1 s then 2 s apart, end before
# Maven Central lifts a rate limit; 6 attempts from 2 s wait up to about a minute in total.
systemProp.org.gradle.internal.network.retry.max.attempts=6
systemProp.org.gradle.internal.network.retry.initial.backOff=2000

# Fabric
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.3
fabric_api_version=0.165.0+26.3
fabric_api_sha256=18442e2ad466d6ef41c37dbb4cb68495e6ca6658b1f1ee9be76143d155ef2c88
# Lithium (server performance mod, vanilla behaviour) goes into the headless server template only, never into the mod;
# scripts/prepare-server-template.mjs and the room and checkpoint batches add it (Modrinth version id in the URL).
lithium_version=0.26.4+mc26.3
lithium_url=https://cdn.modrinth.com/data/gvQqBUqZ/versions/Lal8mJGR/lithium-fabric-0.26.4%2Bmc26.3.jar
lithium_sha256=d4677707fd539d778382deaaea4a466243a81062432ee85f8d62a0eedb49f114
carpet_version=26.3+v260915
voicechat_version=2.6.27+26.3
# The default Minecraft target. Other 26.x targets override these from gradle/mc/<target>.properties (-Pmc=26.2).
mc_compat=26.3
minecraft_dependency=~26.3
carpet_dependency=>=26.3 <26.4
carpet_url=https://github.com/gnembon/fabric-carpet/releases/download/v26.3/fabric-carpet-26.3%2Bv260915.jar
voicechat_modrinth_version=x9jLR94Q
libs_checksums=checksums.sha256

# Mod
