name: Reliability

on:
  pull_request:
    # Drafts run only the Linux coordinator job; marking one ready adds the Boat and Windows jobs.
    types: [opened, synchronize, reopened, ready_for_review]
    # Changes only to docs, eval records or ops notes test nothing. Windows minutes bill at twice the Linux rate.
    paths-ignore: ['docs/**', 'evals/**', 'ops/**', 'README.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'evals/**', 'ops/**', 'README.md']

permissions:
  contents: read

# Concurrency is per job, not per workflow: a draft run must not cancel the Boat jobs of a ready run.
# A newer push to the same pull request cancels the older run of the same job; main pushes always finish.

jobs:
  # Runner labels can be configured per repository; drafts run this job too.
  coordinator-linux:
    name: Coordinator (Linux)
    runs-on: ${{ fromJSON(vars.COORDINATOR_RUNS_ON || '["ubuntu-latest"]') }}
    # The gameplay stake writes one sticky PR comment and a gameplay-stake commit status.
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    # One runner serves every pull request, so a hung test must not hold it for the 6 hour default.
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-coordinator-linux-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      # No Actions cache here: the runner keeps ~/.npm and ~/.gradle between jobs, and saving the cache took 2m41s per run.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Match the explicit Python runtime used by Windows packaging tests.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked coordinator dependencies
        working-directory: coordinator
        run: npm ci --ignore-scripts --omit=dev
      # Evaluates the checked-out merge and publishes to the PR head SHA from the event. continue-on-error keeps a
      # stake failure or crash from skipping the tests below; the gameplay-stake status carries its result. The stake
      # takes under 2 s, so a 5-minute limit stops a hang from using up the job's 30 minutes before the tests run.
      - name: Gameplay stake headlines and sticky PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/quality/stake-ci.mjs --post-status
      - name: Check model-facing contracts
        working-directory: coordinator
        run: npm run test:contracts
      # The whole suite, as boat-ci ran it. It covers every file the portable, process-group and reviewed-regression
      # steps listed before; Windows-only tests skip themselves on Linux. The slowest test takes about 40 s here, so a
      # 2-minute limit per test fails a hung test quickly instead of holding the only runner for the job's 30 minutes.
      - name: Test coordinator (full suite)
        working-directory: coordinator
        run: npm test -- --test-timeout=120000

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Test Java POSIX coordinator ownership
        run: ./gradlew verifyCore --no-daemon --console=plain

  # Off until GitHub billing is fixed or Windows moves to another provider: set the repository variable WINDOWS_CI to "on".
  coordinator-windows:
    name: Coordinator (Windows)
    if: vars.WINDOWS_CI == 'on' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: windows-latest
    concurrency:
      group: ${{ github.workflow }}-coordinator-windows-${{ github.event.pull_request.number || github.sha }}-${{ github.event.pull_request.draft }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: coordinator/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked coordinator dependencies
        working-directory: coordinator
        run: npm ci --ignore-scripts --omit=dev
      - name: Check model-facing contracts
        working-directory: coordinator
        run: npm run test:contracts
      - name: Test coordinator
        working-directory: coordinator
        run: npm run test

  java-targets:
    name: Mod on Minecraft ${{ matrix.mc }}
    # Each leg takes one Boat VM start (200 a day), so drafts skip it. No path filter: the JAR embeds the coordinator and
    # the 26.3 leg runs the script tests.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: boat
    # The draft state is part of the group, so a draft run's skipped leg cannot cancel a ready run's leg.
    concurrency:
      group: ${{ github.workflow }}-mod-${{ matrix.mc }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event.pull_request.draft }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        mc: ['26.1', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: coordinator/package-lock.json
      - name: Install locked coordinator dependencies
        working-directory: coordinator
        run: npm ci --ignore-scripts --omit=dev
      - name: Fetch third-party mod JARs for ${{ matrix.mc }}
        run: ./scripts/fetch-libs.sh ${{ matrix.mc }}
      - name: Check, build and check mixin targets for ${{ matrix.mc }}
        run: ./gradlew -Pmc=${{ matrix.mc }} check build verifyMixinTargets --no-daemon --console=plain
      - name: Test reviewed server harness and compatibility regressions
        if: matrix.mc == '26.3'
        run: |
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 -B -W ignore::ResourceWarning -m unittest discover -s scripts -p 'test_mixin_*.py'
          python3 scripts/test-door-close.py
          python3 -B -m unittest discover -s src/test/python -p 'test_*.py'
      - name: Boot a live ${{ matrix.mc }} server with the mod set
        run: python3 scripts/live-server.py --target ${{ matrix.mc }}
      - name: Upload the ${{ matrix.mc }} mod JAR
        # Only main keeps a JAR. Artifact storage can run out, and that must not fail a tested build.
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: arena-agents-mc${{ matrix.mc }}
          path: |
            build/libs/arena-agents-*.jar
            !build/libs/*-sources.jar
            voice-addon/build/libs/*.jar
            !voice-addon/build/libs/*-sources.jar
          if-no-files-found: error
          # Artifacts count against the account's 2 GB Actions storage; a modpack zip is ~47 MB per run.
          retention-days: 3

  java-and-package:
    name: Java and package (Windows)
    # Off with Coordinator (Windows); see WINDOWS_CI above.
    if: vars.WINDOWS_CI == 'on' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: windows-latest
    concurrency:
      group: ${{ github.workflow }}-java-windows-${{ github.event.pull_request.number || github.sha }}-${{ github.event.pull_request.draft }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: coordinator/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read release version
        shell: powershell
        run: |
          $properties = ConvertFrom-StringData (Get-Content -LiteralPath .\gradle.properties -Raw)
          "MOD_VERSION=$($properties.mod_version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DISTRIBUTION_NAME=arena-agents-modpack-$($properties.mod_version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Assemble pinned standalone Node runtime
        shell: powershell
        run: |
          .\scripts\install-node-runtime.ps1 -ProjectRoot .
          .\scripts\verify-startup-packaging.ps1 -PackageRoot .
      - name: Verify Java, Fabric, and embedded coordinator
        shell: powershell
        run: |
          .\scripts\test-minecraft-server-loopback-policy.ps1
          .\scripts\test-runtime-target-isolation.ps1
          # Gradle's build includes check. The Linux 26.3 job runs check on every pull request; Windows repeats it only for pushes to main.
          $tasks = @('clean', 'assemble', 'packageWindowsDistribution')
          if ($env:GITHUB_EVENT_NAME -eq 'push') { $tasks = @('clean', 'check', 'build', 'packageWindowsDistribution') }
          .\gradlew.bat @tasks --no-daemon --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest scripts.maps.tests.test_map_tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\scripts\maps\verify_map_modules.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $builtMod = ".\build\libs\arena-agents-$env:MOD_VERSION.jar"
          $archive = ".\build\distributions\$env:DISTRIBUTION_NAME.zip"
          .\scripts\verify-coordinator-packaging.ps1 -JarPath $builtMod
          .\scripts\verify-distribution-runtime.ps1
          .\scripts\test-install-normal-profile-update.ps1 -ProjectRoot .
          $unpacked = Join-Path $env:RUNNER_TEMP 'arena-agents-standalone'
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked
          $packagedMod = Join-Path $unpacked "mods\arena-agents-$env:MOD_VERSION.jar"
          if ((Get-FileHash -LiteralPath $packagedMod).Hash -ne (Get-FileHash -LiteralPath $builtMod).Hash) {
            throw 'The standalone archive does not contain the built Arena Agents mod.'
          }
          .\scripts\verify-coordinator-packaging.ps1 -JarPath $packagedMod
          .\scripts\verify-startup-packaging.ps1 -PackageRoot $unpacked
          .\scripts\verify-windows-distribution.ps1 -ArchivePath $archive -BuiltJarPath $builtMod
          .\scripts\test-install-distribution.ps1 -PackageRoot $unpacked -JavaPath (Join-Path $env:JAVA_HOME 'bin\javaw.exe')
      - name: Boot exact staged Fabric mod set
        shell: powershell
        run: |
          .\scripts\prepare-headless-server-template.ps1 -ProjectRoot . -SkipBuild -AcceptMinecraftEula
          .\scripts\verify-distribution-fabric-boot.ps1 `
            -PackageRoot (Join-Path $env:RUNNER_TEMP 'arena-agents-standalone') `
            -ServerTemplate .\runtime\server-template `
            -JavaPath (Join-Path $env:JAVA_HOME 'bin\java.exe')
      - name: Package and verify the 26.1 and 26.2 Windows ZIPs
        # Pull requests package the default 26.3 target above; every push to main also packages 26.1 and 26.2.
        if: github.event_name == 'push'
        shell: powershell
        run: |
          foreach ($target in @('26.1', '26.2')) {
            & bash ./scripts/fetch-libs.sh $target
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            .\gradlew.bat "-Pmc=$target" packageWindowsDistribution --no-daemon --console=plain
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $version = "$env:MOD_VERSION+mc$target"
            .\scripts\verify-windows-distribution.ps1 -ArchivePath ".\build\distributions\arena-agents-modpack-$version.zip" -BuiltJarPath ".\build\libs\arena-agents-$version.jar"
          }
      - name: Upload verified standalone distribution
        # Only main keeps a ZIP. Artifact storage can run out, and that must not fail a tested build.
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DISTRIBUTION_NAME }}
          path: build/distributions/${{ env.DISTRIBUTION_NAME }}.zip
          if-no-files-found: error
          # Artifacts count against the account's 2 GB Actions storage; a modpack zip is ~47 MB per run.
          retention-days: 3
