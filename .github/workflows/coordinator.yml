name: Coordinator

# Coordinator (Linux) is the check main requires, so it runs on every pull request with no path filter: a workflow
# skipped by a path filter leaves a required check waiting forever. A pull request that changes only the paths
# reliability.yml ignores passes after the Detect code changes step without running tests. The mod build and Windows
# jobs stay in reliability.yml behind its path filter, so a docs-only pull request starts neither.
#
# The work runs as parallel jobs: the privacy gate first, then the coordinator suite in two shards beside the Java core
# check. The last job carries the required name and fails if any of them failed, so the required check covers all of it.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'evals/**', 'ops/**', 'README.md']

permissions:
  contents: read

# A newer push to the same pull request cancels the older run; main pushes always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs on drafts too.
  gate:
    name: Privacy gate (Linux)
    # GitHub's runner is free for a public repository; see reliability.yml's java-targets to move back to Boat.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # pull-request-text.mjs reads the pull request and its commits.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and its base parent, so the next step can list what the pull request changes.
          fetch-depth: 2
      # The public repository scans every pull request for private details before anything else, docs-only ones
      # included: the checked-out tree, then the title, description, branch name and every commit message. The
      # private repository holds private files, so it skips these steps.
      - uses: actions/setup-node@v4
        if: ${{ !github.event.repository.private }}
        with:
          node-version: '22'
      - name: Scan the tree for private details
        if: ${{ !github.event.repository.private }}
        run: node scripts/check-public-tree.mjs .
      - name: Scan the pull request text and commit messages for private details
        if: ${{ !github.event.repository.private }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          texts=$(mktemp -d)
          node scripts/pull-request-text.mjs "$texts"
          node scripts/check-public-tree.mjs --text "$texts"/*
      # Keep the pattern in step with reliability.yml's paths-ignore. A push, a failed diff or an empty diff runs every
      # step. --no-renames lists a file moved into docs/ under its old path too, so moving code out counts as code.
      - name: Detect code changes
        id: changes
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && files=$(git diff --name-only --no-renames HEAD^1 HEAD) && [ -n "$files" ]; then
            status=0
            grep -qvE '^((docs|evals|ops)/|README\.md$)' <<<"$files" || status=$?
            if [ "$status" -eq 1 ]; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code"

  node-tests:
    name: Coordinator tests (shard ${{ matrix.shard }}/2)
    needs: gate
    if: needs.gate.outputs.code == 'true'
    runs-on: ubuntu-latest
    # The gameplay stake writes one sticky PR comment and a gameplay-stake commit status.
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    # A hung test must not hold the runner for the 6 hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Two shards halve the suite's wall time; node --test splits the test files between them.
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          # The gameplay stake reads the merge commit's base parent.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: coordinator/package-lock.json
      # Match the explicit Python runtime used by Windows packaging tests.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked coordinator dependencies
        working-directory: coordinator
        run: npm ci --ignore-scripts --omit=dev
      # Evaluates the checked-out merge and publishes to the PR head SHA from the event. continue-on-error keeps a
      # stake failure or crash from skipping the tests below; the gameplay-stake status carries its result. The stake
      # takes under 2 s, so a 5-minute limit stops a hang from using up the job's 30 minutes before the tests run.
      - name: Gameplay stake headlines and sticky PR comment
        if: matrix.shard == 1 && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/quality/stake-ci.mjs --post-status
      # The gate's own tests: its rules, the commit and push hooks, and the pull request text it reads.
      # These two run on shard 2, which has less of the suite than shard 1.
      - name: Test the publication gate
        if: matrix.shard == 2
        run: node --test scripts/tests/public-export.test.mjs
      - name: Check model-facing contracts
        if: matrix.shard == 2
        working-directory: coordinator
        run: npm run test:contracts
      # The whole suite, split by file between the shards. Windows-only tests skip themselves on Linux. The slowest
      # test takes about 40 s here, so a 2-minute limit per test fails a hung test quickly instead of holding the runner
      # for the job's 30 minutes.
      - name: Test coordinator (shard ${{ matrix.shard }}/2)
        working-directory: coordinator
        # Set this repository variable only on a runner that holds the private archive. Empty runs the suite without the
        # recording-based tests, which are then skipped by name.
        env:
          ARENA_PRIVATE_INPUTS: ${{ vars.ARENA_PRIVATE_INPUTS }}
        # npm test's pretest step first, then the suite with the shard flag.
        run: |
          node scripts/prepare-owned-job.mjs
          node scripts/run-public-suite.mjs --test-timeout=120000 --test-shard=${{ matrix.shard }}/2

  java-core:
    name: Java core (Linux)
    needs: gate
    if: needs.gate.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # The repository allows only GitHub's own actions, so the Gradle cache uses actions/cache directly: every job
      # restores its own entry, and only a passing push to main saves one, once per change to the build files.
      - name: Restore the Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-core-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/mc/*.properties', 'gradle/wrapper/gradle-wrapper.properties', '**/gradle.lockfile', 'gradle/locks/**') }}
          restore-keys: gradle-${{ runner.os }}-core-
      # verifyCore stages the coordinator with its node_modules and starts it.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: coordinator/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked coordinator dependencies
        working-directory: coordinator
        run: npm ci --ignore-scripts --omit=dev
      # Idempotent: a tree that already carries the default-target JARs in libs/ only re-verifies their checksums.
      - name: Fetch third-party mod JARs
        run: ./scripts/fetch-libs.sh
      - name: Test Java POSIX coordinator ownership
        run: ./gradlew verifyCore --no-daemon --console=plain
      - name: Save the Gradle cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

  # The check main requires. It passes when the gate passed and both test jobs passed, or, for a docs-only change, when
  # both were skipped.
  coordinator-linux:
    name: Coordinator (Linux)
    needs: [gate, node-tests, java-core]
    # always(): a cancelled run must report failure here, because GitHub counts a skipped required check as passing.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every coordinator job to pass
        env:
          GATE: ${{ needs.gate.result }}
          CODE: ${{ needs.gate.outputs.code }}
          NODE_TESTS: ${{ needs.node-tests.result }}
          JAVA_CORE: ${{ needs.java-core.result }}
        run: |
          echo "Privacy gate: $GATE (code changed: $CODE), coordinator tests: $NODE_TESTS, Java core: $JAVA_CORE"
          [ "$GATE" = success ] || exit 1
          # Code changes need both test jobs to pass; a docs-only change skips both. Any other combination fails.
          case "$CODE" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) echo "The gate reported no code-change result"; exit 1 ;;
          esac
          [ "$NODE_TESTS" = "$expected" ] && [ "$JAVA_CORE" = "$expected" ]
